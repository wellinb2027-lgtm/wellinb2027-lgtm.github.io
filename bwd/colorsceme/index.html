
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Breeze Color Scheme</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F4F8F7;
            padding: 30px;
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #999;
            padding: 15px;
            text-align: center;
        }

        .scheme-title {
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
            background-color: #0F6B6E;
            color: white;
            padding: 20px;
        }

        .column-heading {
            background-color: #DCEAE7;
        }

        .deep-teal {
            background-color: #0F6B6E;
            color: white;
            font-weight: bold;
        }

        .seafoam-green {
            background-color: #A8D5BA;
            color: #173D2B;
            font-weight: bold;
        }

        .sky-blue {
            background-color: #87CEEB;
            color: #173447;
            font-weight: bold;
        }

        .sandy-beige {
            background-color: #E6D5B8;
            color: #493D2B;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <center><img src="images/beach.jpeg"></center>
    
    <table>
        <tr>
            <th colspan="4" class="scheme-title">
                Ocean Breeze Color Scheme
            </th>
        </tr>

        <tr class="column-heading">
            <th>Color Name</th>
            <th>HEX Value</th>
            <th>RGB Value</th>
            <th>HSL Value</th>
        </tr>

        <tr>
            <td class="deep-teal">Deep Teal</td>
            <td>#0F6B6E</td>
            <td>rgb(15, 107, 110)</td>
            <td>hsl(182, 76%, 25%)</td>
        </tr>

        <tr>
            <td class="seafoam-green">Seafoam Green</td>
            <td>#A8D5BA</td>
            <td>rgb(168, 213, 186)</td>
            <td>hsl(144, 34%, 75%)</td>
        </tr>

        <tr>
            <td class="sky-blue">Sky Blue</td>
            <td>#87CEEB</td>
            <td>rgb(135, 206, 235)</td>
            <td>hsl(197, 71%, 73%)</td>
        </tr>

        <tr>
            <td class="sandy-beige">Sandy Beige</td>
            <td>#E6D5B8</td>
            <td>rgb(230, 213, 184)</td>
            <td>hsl(38, 47%, 81%)</td>
        </tr>
    </table>

</body>
</html>
