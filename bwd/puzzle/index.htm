<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid and Flexbox Picture Puzzle Assignment</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1, h2, h3 {
            color: #2c3e50;
        }

        /* Part 1: CSS Grid Page Layout */
        .page-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            grid-template-rows: auto auto auto;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-section {
            grid-column: 1 / -1;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        .info-section {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .puzzle-section {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Part 2: Flexbox Puzzle Container */
        .flex-puzzle-container {
            display: flex;
            flex-wrap: wrap;
            /* Adjust width to match the combined dimensions of your puzzle pieces */
            width: 300px; 
            height: 300px;
            border: 4px solid #34495e;
            background-color: #ecf0f1;
            border-radius: 4px;
        }

        /* Flex Puzzle Pieces */
        .flex-puzzle-container img {
            /* Set dimensions based on individual piece sizes */
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin: 0;
            padding: 0;
            display: block;
        }

        /* Requirement: Hide the faulty/trick puzzle piece using the display property */
        .faulty-piece {
            display: none;
        }

        .date-section {
            grid-column: 1 / -1;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="page-container">
        
        <header class="header-section">
            <h1>CSS Grid & Flexbox Picture Puzzle</h1>
        </header>
  
        <section class="puzzle-section">
            <h2>Solved Puzzle Image</h2>
            <div class="flex-puzzle-container">
                
                <img src="image/piece1.jpg" alt="Puzzle Piece 1">
                <img src="image/piece2.jpg" alt="Puzzle Piece 2">
                <img src="image/piece3.jpg" alt="Puzzle Piece 3">
                <img src="image/piece4.jpg" alt="Puzzle Piece 4">
                <img src="image/piece5.jpg" alt="Puzzle Piece 5">
                <img src="image/piece6.jpg" alt="Puzzle Piece 6">
                <img src="image/piece7.jpg" alt="Puzzle Piece 7">
                <img src="image/piece8.jpg" alt="Puzzle Piece 8">
                <img src="image/piece9.jpg" alt="Puzzle Piece 9">
                
               
                <img src="image/faulty-piece.jpg" alt="Faulty Puzzle Piece" class="faulty-piece">
            </div>
        </section>

    </div>

</body>
</html>
