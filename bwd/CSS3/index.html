<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Image Effects</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <header class="page-header">
        <h1>CSS3 Image Effects</h1>
        <p>Six examples using CSS instead of editing the original pictures.</p>
    </header>

    <main class="projects">
        <section class="project">
            <h2>1. Rounded Penguin Picture</h2>
            <div class="penguin-frame">
                <img src="images/penguins.jpg" alt="A group of penguins standing together">
            </div>
        </section>

        <section class="project football-project">
            <h2>2. Football Field Background</h2>
            <div class="football-board" role="img" aria-label="Football field surrounded by a tic-tac-toe pattern"></div>
        </section>

        <section class="project">
            <h2>3. Dinosaur Color and Shadow</h2>
            <div class="dino-area">
                <img class="dinosaur" src="images/dinosaur.png" alt="A cartoon green dinosaur">
            </div>
        </section>

        <section class="project">
            <h2>4. Seagull with Gradient Background</h2>
            <div class="seagull-frame">
                <img src="images/seagull.png" alt="A seagull flying with its wings spread">
            </div>
        </section>

        <section class="project">
            <h2>5. Butterfly Color Filter</h2>
            <div class="butterfly-frame">
                <img src="images/butterfly.jpg" alt="A monarch butterfly on flowers">
            </div>
        </section>

        <section class="project">
            <h2>6. Blurred Theater Background</h2>
            <div class="theater-card">
                <img src="images/theater_stage.jpg" alt="">
                <div class="theater-title">Presenting</div>
            </div>
        </section>
    </main>
    
</body>
</html>
