
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Math Test</title>
</head>
<body>

    <h1>Online Math Test</h1>
    <p>Answer all the questions below.</p>

    <!-- Start of Math Test -->

    <form action="#" method="post">

        <label for="studentName">Enter your name:</label>
        <input type="text" id="studentName" name="studentName" required>

        <hr>

        <h2>Multiple Choice Questions</h2>

        <p>1. What is 8 + 7?</p>
        <input type="radio" id="q1a" name="question1" value="12">
        <label for="q1a">12</label><br>

        <input type="radio" id="q1b" name="question1" value="15">
        <label for="q1b">15</label><br>

        <input type="radio" id="q1c" name="question1" value="16">
        <label for="q1c">16</label><br>

        <p>2. What is 6 &times; 4?</p>
        <input type="radio" id="q2a" name="question2" value="20">
        <label for="q2a">20</label><br>

        <input type="radio" id="q2b" name="question2" value="24">
        <label for="q2b">24</label><br>

        <input type="radio" id="q2c" name="question2" value="28">
        <label for="q2c">28</label><br>

        <p>3. What is 20 &divide; 5?</p>
        <input type="radio" id="q3a" name="question3" value="4">
        <label for="q3a">4</label><br>

        <input type="radio" id="q3b" name="question3" value="5">
        <label for="q3b">5</label><br>

        <input type="radio" id="q3c" name="question3" value="6">
        <label for="q3c">6</label><br>

        <hr>

        <h2>Word Problem</h2>

        <p>
            4. Sarah has 3 bags with 6 apples in each bag.
            She gives 5 apples to her friend. How many apples
            does Sarah have left? Explain your answer.
        </p>

        <label for="wordAnswer">Your answer:</label><br>
        <textarea id="wordAnswer" name="wordAnswer"
                  rows="5" cols="40"></textarea>

        <br><br>

        <button type="submit">Submit Test</button>

    </form>

    <!-- End of Math Test -->

</body>
</html>
